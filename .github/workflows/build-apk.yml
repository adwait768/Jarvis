name: Build 768 AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract AndroidIDE project
        run: |
          mkdir -p android-project
          unzip -q JARVIS_v1_ANDROIDIDE_READY.zip -d android-project
          PROJECT_DIR="$(find android-project -type f -name settings.gradle.kts -printf '%h\\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle.kts inside JARVIS_v1_ANDROIDIDE_READY.zip"
            find android-project -maxdepth 3 -type f | head -80
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$ANDROID_PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 768-AI-debug-apk
          path: android-project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
