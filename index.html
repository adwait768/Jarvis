<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#02070c">
<title>JARVIS AI</title>

<style>
*{box-sizing:border-box}
body{
margin:0;background:#02060a;color:#dffaff;
font-family:Arial,sans-serif;min-height:100vh
}
.app{
max-width:520px;min-height:100vh;margin:auto;padding:18px;
display:flex;flex-direction:column;
background:radial-gradient(circle at 50% 22%,#073b59,#06151f 30%,#02060a 70%)
}
.header{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:29px;font-weight:bold;letter-spacing:7px;text-shadow:0 0 15px #00bfff}
.online{font-size:11px;color:#36dcff;letter-spacing:2px}

.reactor{
width:205px;height:205px;margin:27px auto 15px;
border:2px solid #16c9ff;border-radius:50%;
display:flex;align-items:center;justify-content:center;
position:relative;box-shadow:0 0 25px #008dcc,inset 0 0 25px #008dcc;
animation:pulse 2s infinite
}
.ring{position:absolute;border-radius:50%;border:2px solid #168dbd}
.r1{width:170px;height:170px;border-left-color:transparent;animation:spin 5s linear infinite}
.r2{width:135px;height:135px;border-right-color:transparent;animation:rev 3s linear infinite}
.r3{width:98px;height:98px;border-top-color:transparent;animation:spin 2s linear infinite}
.r4{width:72px;height:72px;border-bottom-color:transparent;animation:rev 1.5s linear infinite}
.core{
width:48px;height:48px;border-radius:50%;background:#e8fcff;
box-shadow:0 0 20px #00c8ff,0 0 50px #008cff;
z-index:5;animation:glow 1.2s infinite alternate
}

.title{text-align:center;font-size:22px;font-weight:bold}
.subtitle{text-align:center;font-size:13px;color:#78a7b9;margin:5px 0 14px}

.system{
display:flex;justify-content:space-around;margin:10px 0;padding:10px;
border:1px solid #173c4d;border-radius:12px;background:#07131b;
font-size:10px;color:#70c8df
}
.system span{display:block;text-align:center;margin-top:4px;color:#dffaff}

.chat{flex:1;min-height:240px;max-height:300px;overflow-y:auto;padding:5px}
.message{
padding:12px 14px;margin:8px 0;border-radius:15px;
max-width:88%;line-height:1.4;font-size:14px
}
.jarvis{background:#0d202c;border:1px solid #205064}
.user{background:#075d8d;margin-left:auto}

.controls{display:flex;gap:7px;margin-top:7px}
input{
flex:1;min-width:0;padding:14px;border-radius:14px;
border:1px solid #25536a;background:#09141c;color:white;
font-size:14px;outline:none
}
input:focus{border-color:#20caff;box-shadow:0 0 10px #006f9c}
.send{
border:0;border-radius:14px;padding:0 16px;
background:#078ed0;color:white;font-weight:bold
}

.mic{
width:78px;height:78px;margin:13px auto;border-radius:50%;
border:2px solid #20caff;background:#064b70;color:white;font-size:28px;
box-shadow:0 0 22px #007db7
}
.mic.listening{background:#087ca8;transform:scale(1.08);box-shadow:0 0 35px #00c8ff}

.quick{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px}
.quick button{
white-space:nowrap;padding:9px 13px;border-radius:20px;
border:1px solid #21495c;background:#0b1b25;color:#8edfff
}

.panel{
margin-top:12px;padding:12px;border:1px solid #173c4d;
border-radius:13px;background:#07131b
}
.panel-title{font-size:11px;letter-spacing:2px;color:#36cfff;margin-bottom:7px}
.row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:#86aebb}
.row b{color:#dffaff}

@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes rev{from{transform:rotate(360deg)}to{transform:rotate(0)}}
@keyframes pulse{50%{box-shadow:0 0 50px #00bfff,inset 0 0 35px #008dcc}}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.18)}}
</style>
</head>

<body>

<div class="app">

<div class="header">
<div class="logo">JARVIS</div>
<div class="online">● ONLINE</div>
</div>

<div class="reactor">
<div class="ring r1"></div>
<div class="ring r2"></div>
<div class="ring r3"></div>
<div class="ring r4"></div>
<div class="core"></div>
</div>

<div class="title">Hello, I'm JARVIS.</div>
<div class="subtitle">Personal command assistant</div>

<div class="system">
<div>SYSTEM<span>ONLINE</span></div>
<div>VOICE<span id="voiceState">READY</span></div>
<div>MODE<span>LOCAL</span></div>
</div>

<div id="chat" class="chat">
<div class="message jarvis">
Good evening. All systems are online.<br>
Awaiting your command.
</div>
</div>

<div class="controls">
<input id="input" placeholder="Ask JARVIS..." autocomplete="off">
<button class="send" onclick="send()">SEND</button>
</div>

<button id="mic" class="mic" onclick="listen()">🎙️</button>

<div class="quick">
<button onclick="ask('What time is it?')">Time</button>
<button onclick="ask('What is today?')">Date</button>
<button onclick="ask('Calculate 25 + 17')">Calculate</button>
<button onclick="ask('What is my system status?')">Status</button>
<button onclick="openYouTube()">YouTube</button>
<button onclick="searchGoogle()">Search</button>
</div>

<div class="panel">
<div class="panel-title">SYSTEM INFORMATION</div>
<div class="row"><span>Assistant</span><b>JARVIS</b></div>
<div class="row"><span>Engine</span><b>LOCAL</b></div>
<div class="row"><span>Clock</span><b id="clock">--:--</b></div>
<div class="row"><span>Browser</span><b id="browser">WEB</b></div>
</div>

</div>

<script>

const input=document.getElementById("input");
const chat=document.getElementById("chat");
const mic=document.getElementById("mic");
const voiceState=document.getElementById("voiceState");

function add(text,type){
const m=document.createElement("div");
m.className="message "+type;
m.textContent=text;
chat.appendChild(m);
chat.scrollTop=chat.scrollHeight;
}

function ask(text){
input.value=text;
send();
}

function send(){

const text=input.value.trim();

if(!text)return;

add(text,"user");
input.value="";

command(text);
}

function command(text){

const c=text.toLowerCase();
let reply="";

if(c.includes("hello")||c.includes("hi")||c.includes("hey")){
reply="Hello. JARVIS is online and ready.";
}

else if(c.includes("time")){
reply="The current time is "+new Date().toLocaleTimeString();
}

else if(c.includes("date")||c.includes("today")){
reply="Today is "+new Date().toLocaleDateString(
undefined,
{weekday:"long",year:"numeric",month:"long",day:"numeric"}
);
}

else if(c.includes("status")||c.includes("system")){
reply="System status: online. Voice engine ready. Local command engine operational.";
}

else if(c.includes("who are you")){
reply="I am JARVIS, your personal command assistant.";
}

else if(c.includes("weather")){
reply="I can open a web search for your local weather.";
setTimeout(searchGoogle,500);
}

else if(c.includes("youtube")){
reply="Opening YouTube.";
openYouTube();
}

else if(c.includes("search")||c.includes("google")){
reply="Opening Google search.";
setTimeout(searchGoogle,500);
}

else if(c.includes("calculate")){

const expression=text.replace(/calculate/i,"").trim();

try{
const safe=expression.replace(/[^0-9+\-*/().% ]/g,"");

if(safe){
const result=Function('"use strict";return ('+safe+')')();
reply="The answer is "+result+".";
}else{
reply="Please give me a calculation, for example: Calculate 25 + 17.";
}
}catch(e){
reply="I couldn't calculate that expression.";
}
}

else if(c.includes("help")){

reply=
"I can currently help with time, date, calculations, system status, YouTube, Google search, greetings, and voice commands.";
}

else if(c.includes("thank")){
reply="You're welcome. Always ready.";
}

else{

reply=
"I received your command. My local command engine doesn't know that one yet.";
}

setTimeout(()=>{
add(reply,"jarvis");
speak(reply);
},350);

}

function speak(text){

if(!(\"speechSynthesis\" in window))return;

speechSynthesis.cancel();

const u=new SpeechSynthesisUtterance(text);

u.lang=\"en-IN\";
u.rate=.95;

speechSynthesis.speak(u);

}

function listen(){

const Recognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!Recognition){

add("Voice recognition isn't supported in this browser.","jarvis");
return;
}

const r=new Recognition();

r.lang="en-IN";
r.continuous=false;
r.interimResults=false;

mic.classList.add("listening");
voiceState.textContent="LISTENING";

r.onresult=function(e){

input.value=e.results[0][0].transcript;

send();
};

r.onerror=function(){

add("I couldn't hear you. Please try again.","jarvis");

};

r.onend=function(){

mic.classList.remove("listening");
voiceState.textContent="READY";

};

r.start();
}

function openYouTube(){

window.open("https://www.youtube.com","_blank");

}

function searchGoogle(){

const q=prompt("What should JARVIS search for?");

if(q){

window.open(
"https://www.google.com/search?q="+encodeURIComponent(q),
"_blank"
);

}

}

function updateClock(){

document.getElementById("clock").textContent=
new Date().toLocaleTimeString();

}

setInterval(updateClock,1000);
updateClock();

input.addEventListener("keydown",function(e){

if(e.key==="Enter")send();

});

</script>

</body>
</html>
