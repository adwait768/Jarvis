<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070d">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#02070d;color:#dff8ff;font-family:Arial,sans-serif}body{overflow:hidden}.app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 20%,#07334b 0,#06131e 28%,#02070d 65%);padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:27px;font-weight:bold;letter-spacing:7px;text-shadow:0 0 15px #19cfff}.online{font-size:11px;letter-spacing:2px;color:#55e6ff}.core{width:190px;height:190px;margin:20px auto 10px;border:2px solid #20d7ff;border-radius:50%;position:relative;display:grid;place-items:center;box-shadow:0 0 24px #008fc7,inset 0 0 25px #008fc7}.core:before,.core:after{content:"";position:absolute;border:2px solid #168db8;border-radius:50%}.core:before{inset:17px}.core:after{inset:40px}.ring{position:absolute;inset:7px;border:1px dashed #26bce4;border-radius:50%;animation:spin 9s linear infinite}.ring2{inset:27px;animation:spin 6s linear infinite reverse}.orb{width:62px;height:62px;border-radius:50%;background:#d9fbff;box-shadow:0 0 28px #00cfff,0 0 65px #007dff;animation:pulse 2s ease-in-out infinite}.greet{text-align:center;font-size:21px;font-weight:bold}.sub{text-align:center;color:#78a8b8;font-size:13px;margin:5px 0 10px}.statusbar{display:flex;justify-content:center;gap:12px;font-size:10px;letter-spacing:1px;color:#63dfff;margin-bottom:6px}.chat{flex:1;min-height:120px;overflow:auto;padding:4px 2px 8px}.msg{padding:11px 13px;margin:7px 0;border-radius:15px;max-width:88%;line-height:1.4;font-size:15px;white-space:pre-wrap}.jarvis{background:#0b1d29;border:1px solid #17465b}.you{background:#075b85;margin-left:auto;color:#fff}.controls{display:flex;gap:8px}.input{flex:1;background:#08131d;border:1px solid #205066;color:#fff;border-radius:14px;padding:13px;outline:none;font-size:15px}.btn{border:0;border-radius:14px;background:#079bd6;color:white;font-weight:bold;padding:0 15px}.mic{display:block;margin:10px auto 8px;width:66px;height:66px;border-radius:50%;border:2px solid #25d7ff;background:#06486a;color:#fff;font-size:27px;box-shadow:0 0 22px #007bb5}.mic.listening{background:#b33b45;animation:pulse 1s infinite}.quick{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.quick button{white-space:nowrap;background:#091a25;color:#8feaff;border:1px solid #205067;border-radius:18px;padding:8px 12px}small{color:#7095a3}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.07);filter:brightness(1.25)}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="brand">JARVIS</div><div class="online">● ONLINE</div></div>
<div class="core"><div class="ring"></div><div class="ring ring2"></div><div class="orb"></div></div>
<div class="greet">Hello, I'm JARVIS.</div><div class="sub">Your personal AI assistant</div>
<div class="statusbar"><span>CORE ONLINE</span><span id="voiceStatus">VOICE READY</span><span>LOCAL MODE</span></div>
<div id="chat" class="chat"><div class="msg jarvis">Good evening. Systems online. How can I help you?</div></div>
<div class="controls"><input id="input" class="input" placeholder="Ask JARVIS..." autocomplete="off"><button class="btn" onclick="send()">SEND</button></div>
<button id="mic" class="mic" onclick="toggleMic()">🎙️</button>
<div class="quick"><button onclick="ask('What time is it?')">Time</button><button onclick="ask('What is today?')">Date</button><button onclick="ask('System status')">Status</button><button onclick="openYT()">YouTube</button><button onclick="searchWeb()">Search</button><button onclick="ask('Help')">Help</button></div>
</div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),mic=document.getElementById('mic'),voiceStatus=document.getElementById('voiceStatus');
function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function ask(t){input.value=t;send()}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
function calc(expr){try{if(!/^[0-9+\-*/().%\s]+$/.test(expr))return null;return Function('"use strict";return ('+expr+')')()}catch(e){return null}}
function reply(t){const x=t.toLowerCase().trim();let r='';
if(/\b(hello|hi|hey)\b/.test(x))r='Hello. JARVIS is online and ready.';
else if(x.includes('time'))r='The current time is '+new Date().toLocaleTimeString();
else if(x.includes('date')||x.includes('today'))r='Today is '+new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
else if(x.includes('status'))r='All core systems are online. Mode: local browser intelligence.';
else if(x.includes('who are you')||x.includes('what are you'))r='I am JARVIS, your browser-based personal assistant.';
else if(x.includes('youtube')){openYT();r='Opening YouTube.'}
else if(x.startsWith('search ')){const q=t.slice(7).trim();window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank');r='Searching the web for '+q+'.'}
else if(x==='help'||x.includes('what can you do'))r='I can tell the time and date, calculate expressions, open YouTube, search the web, use voice input, and handle local commands. More intelligence can be added next.';
else {const cleaned=t.replace(/^calculate\s+/i,'').replace(/^what is\s+/i,'').trim();const n=calc(cleaned);if(n!==null&&cleaned!==t||n!==null&&/^[0-9+\-*/().%\s]+$/.test(t))r='The answer is '+n+'.';else r='I received your command. My local brain does not know that one yet.'}
return r}
function send(){const t=input.value.trim();if(!t)return;add(t,'you');input.value='';const r=reply(t);setTimeout(()=>{add(r,'jarvis');speak(r)},220)}
function openYT(){window.open('https://www.youtube.com','_blank')}
function searchWeb(){const q=prompt('What should JARVIS search for?');if(q)window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank')}
let recognition=null,listening=false;
function toggleMic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){add('Voice recognition is not supported in this browser. Try Chrome over HTTPS.','jarvis');return}if(listening){recognition.stop();return}recognition=new R();recognition.lang='en-IN';recognition.interimResults=false;recognition.continuous=false;recognition.onstart=()=>{listening=true;mic.classList.add('listening');voiceStatus.textContent='VOICE LISTENING'};recognition.onresult=e=>{input.value=e.results[0][0].transcript;send()};recognition.onerror=e=>{add('Microphone error: '+e.error,'jarvis')};recognition.onend=()=>{listening=false;mic.classList.remove('listening');voiceStatus.textContent='VOICE READY'};recognition.start()}
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
